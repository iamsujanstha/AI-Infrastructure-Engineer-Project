services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: local_ai_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d local_ai_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  context-engine:
    build: ./apps/context-engine
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CONTEXT_ENGINE_TOKEN: ${CONTEXT_ENGINE_TOKEN:-context-engine-local-dev-token-change-before-use-32}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    profiles: [legacy]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
