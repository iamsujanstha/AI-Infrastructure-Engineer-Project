[project]
name = "context-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pyyaml>=6.0.2,<7",
    "psycopg[binary]>=3.2,<4",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-graphql>=0.1,<0.2",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-json>=0.24,<0.25",
    "tree-sitter-postgres>=1.2,<2",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-yaml>=0.7,<0.8",
    "uvicorn>=0.34,<1",
    "pypdf>=6,<7",
    "fastembed>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

